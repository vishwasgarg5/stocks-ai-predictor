name: P1 Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/p1_validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q src

      - name: P1 tests
        run: python -m pytest -q tests/test_p1_data_path.py
