name: P1 Validation

on:
  push:
    branches: ["fix/p1-data-cache-universe-buckets"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src tests
      - run: python -m pytest -q tests/test_p1_data_path.py tests/test_prediction_lineage.py tests/test_data_snapshot.py tests/test_report_integrity.py
