name: Stage 28 Morning Command Center

on:
  schedule:
    - cron: "45 2 * * 1-5" # 08:15 IST, Monday-Friday
    - cron: "00 3 * * 1-5" # 08:30 IST fallback if the primary schedule is delayed/missed
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/stage10_5_morning.yml"

concurrency:
  group: stage28-state
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  prediction:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Update Stage 28 morning prediction state')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scheduled-run duplicate guard
        id: schedule_guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Non-scheduled trigger: prediction run permitted."
            exit 0
          fi
          MARKET_DATE="$(TZ=Asia/Kolkata date +%F)"
          LEDGER="data/stage2/predictions/predictions_${MARKET_DATE}.csv"
          if [ -s "$LEDGER" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Prediction ledger already exists for ${MARKET_DATE}; fallback schedule will not duplicate it."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No prediction ledger for ${MARKET_DATE}; prediction run permitted."
          fi

      - name: Setup Python
        if: steps.schedule_guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m py_compile src/*.py

      - name: Repair portfolio AI compatibility aliases
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/portfolio_report.py")
          text = p.read_text(encoding="utf-8")
          start = text.find("def _attach_predictions(base):")
          end = text.find("def _forecast_return(row):", start)
          if start < 0 or end < 0:
              raise SystemExit("portfolio_report.py _attach_predictions boundaries not found")
          replacement = '''def _attach_predictions(base):
    pred,date=_latest_predictions();out=base.copy()
    if pred.empty:return out,date
    pred=pred.copy()
    pred["Ticker"]=pred["Symbol"].astype(str).map(_ticker)
    keep=[c for c in ["Ticker","Prediction_ID","Pred_Close","Pred_Open","Pred_High","Pred_Low","Confidence","CalibratedConfidence","Direction","Action"]+[f"Horizon_{h}D" for h in HORIZONS] if c in pred.columns]
    merged=out.merge(pred[keep].drop_duplicates("Ticker",keep="last"),on="Ticker",how="left")
    # Canonical prediction fields remain authoritative; aliases preserve legacy portfolio consumers.
    alias_map={"AI_Target":"Pred_Close","AI_Open":"Pred_Open","AI_High":"Pred_High","AI_Low":"Pred_Low"}
    for alias,source in alias_map.items():
        if source in merged.columns:
            merged[alias]=pd.to_numeric(merged[source],errors="coerce")
    return merged,date

'''
          text = text[:start] + replacement + text[end:]
          p.write_text(text, encoding="utf-8")
          PY

      - name: Post-repair syntax check
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m py_compile src/*.py

      - name: Stage 28 contract and regression tests
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python -m pytest -q \
            tests/test_stage28_contract.py \
            tests/test_stage10_5.py \
            tests/test_stage10_5_hardening.py \
            tests/test_stage10_5_trade_gating.py \
            tests/test_portfolio_report_schema.py \
            tests/test_portfolio_stage28_hardening.py \
            tests/test_market_outlook.py \
            tests/test_data_snapshot.py \
            tests/test_report_integrity.py \
            tests/test_prediction_lineage.py

      - name: Live market-data quality gate
        if: steps.schedule_guard.outputs.run == 'true'
        run: python -m src.live_quality_gate morning

      - name: Run Stage 28 morning prediction
        if: steps.schedule_guard.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.morning_runner

      - name: Commit GitHub state
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          git config user.name "stocks-ai-predictor"
          git config user.email "actions@github.com"
          git add src/ data/stage2/
          if git diff --cached --quiet; then echo "No data/source changes."; exit 0; fi
          git commit -m "Update Stage 28 morning prediction state"
          git pull --rebase origin main
          git push
