name: Stage 10.5 Morning Prediction

on:
  schedule:
    - cron: "30 23 * * 0-4" # 05:00 IST, Monday-Friday
  workflow_dispatch:

concurrency:
  group: stage10-5-morning
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prediction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ensure 10D horizon is wired into morning pipeline
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("src/morning_runner.py")
          s=p.read_text()
          old="for horizon in [1,3,5,7,20]:"
          new="for horizon in [1,3,5,7,10,20]:"
          if old in s:
              p.write_text(s.replace(old,new,1))
              print("Patched morning_runner.py: added 10D horizon")
          elif new in s:
              print("10D horizon already wired")
          else:
              raise SystemExit("Expected horizon loop not found; refusing unsafe edit")
          PY
      - name: Run hardening and market snapshot tests
        run: python -m pytest -q tests/test_stage10_5_hardening.py tests/test_portfolio_report_schema.py tests/test_market_snapshot_expanded.py
      - name: Live market-data quality gate
        run: python -m src.live_quality_gate morning
      - name: Run Stage 10.5 morning prediction
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.morning_runner
      - name: Commit GitHub state
        run: |
          git config user.name "stocks-ai-predictor"
          git config user.email "actions@github.com"
          git add src/morning_runner.py data/stage2/
          if git diff --cached --quiet; then echo "No data/source changes."; exit 0; fi
          git commit -m "Wire 10D horizon into morning predictions"
          git pull --rebase origin main
          git push
