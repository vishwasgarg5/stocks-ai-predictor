name: Stage 10.5 Morning Prediction

on:
  schedule:
    - cron: "30 23 * * 0-4"
  workflow_dispatch:

concurrency:
  group: stage10-5-morning
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prediction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile src/*.py
      - name: Run hardening, portfolio and market-outlook tests
        run: |
          python -m pytest -q tests/test_stage10_5.py tests/test_stage10_5_hardening.py tests/test_portfolio_report_schema.py tests/test_market_outlook.py
      - name: Live market-data quality gate
        run: python -m src.live_quality_gate morning
      - name: Run Stage 10.5 morning prediction
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.morning_runner
      - name: Commit GitHub state
        run: |
          git config user.name "stocks-ai-predictor"
          git config user.email "actions@github.com"
          git add src/ data/stage2/
          if git diff --cached --quiet; then echo "No data/source changes."; exit 0; fi
          git commit -m "Update Stage 10.5 morning prediction state"
          git pull --rebase origin main
          git push
