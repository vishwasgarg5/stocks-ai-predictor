name: Stage 10.5 Morning Prediction

on:
  schedule:
    - cron: "30 22 * * 0-4" # 04:00 IST, Monday-Friday
  workflow_dispatch:

concurrency:
  group: stage10-5-morning
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prediction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Stage 10.5 morning prediction
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.morning_runner
      - name: Commit GitHub state
        run: |
          git config user.name "stocks-ai-predictor"
          git config user.email "actions@github.com"
          git add data/stage2/
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "Run Stage 10.5 morning prediction"
          git pull --rebase origin main
          git push
