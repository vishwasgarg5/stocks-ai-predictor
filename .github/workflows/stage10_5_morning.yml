name: Stage 10.5 Morning Prediction

on:
  schedule:
    - cron: "30 23 * * 0-4" # 05:00 IST, Monday-Friday
  workflow_dispatch:

concurrency:
  group: stage10-5-morning
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prediction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Wire 10D horizon, market outlook and report syntax fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path("src/morning_runner.py")
          s=p.read_text()
          old="for horizon in [1,3,5,7,20]:"
          new="for horizon in [1,3,5,7,10,20]:"
          if old in s:s=s.replace(old,new,1)
          p.write_text(s)

          p=Path("src/market_data.py")
          s=p.read_text()
          old='    _install_extended_market_renderer(snap);return snap'
          new='    snap["RegimePrediction"]=get_market_regime(cutoff);_install_extended_market_renderer(snap);return snap'
          if old in s:s=s.replace(old,new,1)
          elif 'snap["RegimePrediction"]=get_market_regime(cutoff)' not in s:raise SystemExit("Expected market snapshot return not found")
          p.write_text(s)

          p=Path("src/telegram_report.py")
          lines=p.read_text().splitlines()
          fixed=False
          out=[]
          for line in lines:
              if "sections.append(\"\\n\".join([f\"💎 *₹ {_bucket_label(bucket,g)}*\"" in line and "Difference%" in line:
                  indent=line[:len(line)-len(line.lstrip())]
                  out.append(indent+'table=_table(["Type","Open","High","Low","Close"],[["Predicted",*[_fmt(v) for v in pred]],["Actual",*[_fmt(v) for v in actual]],["Difference%",*[_pct(_diff_pct(p,a)) for p,a in zip(pred,actual)]]])')
                  out.append(indent+'sections.append("\\n".join([f"💎 *₹ {_bucket_label(bucket,g)}*",f"*{str(r.get(\'Symbol\',\'-\')).strip()}*",*table]))')
                  fixed=True
              else:
                  out.append(line)
          if not fixed:
              raise SystemExit("Expected malformed evaluation table line not found")
          p.write_text("\n".join(out)+"\n")
          print("10D horizon, market outlook and report syntax fix wired")
          PY
          python -m py_compile src/telegram_report.py src/morning_runner.py src/market_data.py
      - name: Run hardening, portfolio and market-outlook tests
        run: python -m pytest -q tests/test_stage10_5_hardening.py tests/test_portfolio_report_schema.py tests/test_market_outlook.py
      - name: Live market-data quality gate
        run: python -m src.live_quality_gate morning
      - name: Run Stage 10.5 morning prediction
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.morning_runner
      - name: Commit GitHub state
        run: |
          git config user.name "stocks-ai-predictor"
          git config user.email "actions@github.com"
          git add src/morning_runner.py src/market_data.py src/telegram_report.py data/stage2/
          if git diff --cached --quiet; then echo "No data/source changes."; exit 0; fi
          git commit -m "Fix morning report syntax and market outlook wiring"
          git pull --rebase origin main
          git push
