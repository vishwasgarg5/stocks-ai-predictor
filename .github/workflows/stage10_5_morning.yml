name: Stage 10.5 Morning Prediction

on:
  schedule:
    - cron: "30 23 * * 0-4" # 05:00 IST, Monday-Friday
  workflow_dispatch:

concurrency:
  group: stage10-5-morning
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prediction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Wire 10D horizon, market outlook and report syntax fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path("src/morning_runner.py")
          s=p.read_text()
          s=s.replace("for horizon in [1,3,5,7,20]:","for horizon in [1,3,5,7,10,20]:",1)
          p.write_text(s)

          p=Path("src/market_data.py")
          s=p.read_text()
          old='    _install_extended_market_renderer(snap);return snap'
          new='    snap["RegimePrediction"]=get_market_regime(cutoff);_install_extended_market_renderer(snap);return snap'
          if old in s:s=s.replace(old,new,1)
          elif 'snap["RegimePrediction"]=get_market_regime(cutoff)' not in s:raise SystemExit("Expected market snapshot return not found")
          pattern=r'def get_market_regime\(cutoff_date=None\):.*?(?=def get_row_for_date)'
          replacement='''def get_market_regime(cutoff_date=None):\n    df=get_nifty_data("1y")\n    if df.empty:return {"name":"UNKNOWN","score":50,"confidence":35}\n    if cutoff_date is not None:df=df[df.index.date<=pd.Timestamp(cutoff_date).date()]\n    if len(df)<60:return {"name":"SIDEWAYS","score":50,"confidence":35}\n    close=pd.to_numeric(df["Close"],errors="coerce").dropna()\n    if len(close)<60:return {"name":"SIDEWAYS","score":50,"confidence":35}\n    sma20=close.rolling(20).mean().iloc[-1];sma50=close.rolling(50).mean().iloc[-1];sma200=close.rolling(200).mean().iloc[-1] if len(close)>=200 else sma50\n    ret20=(close.iloc[-1]/close.iloc[-21]-1)*100 if len(close)>=21 else 0.0\n    ret60=(close.iloc[-1]/close.iloc[-61]-1)*100 if len(close)>=61 else 0.0\n    vol=close.pct_change().rolling(20).std().iloc[-1]*100\n    current=close.iloc[-1];score=50.0\n    score += 10 if current>sma20 else -10\n    score += 10 if current>sma50 else -10\n    score += 10 if current>sma200 else -10\n    score += 8 if ret20>2 else -8 if ret20<-2 else 0\n    score += 7 if ret60>5 else -7 if ret60<-5 else 0\n    if vol>2.5:score-=8\n    score=max(0,min(100,score))\n    name="BULL" if score>=65 else "BEAR" if score<=40 else "SIDEWAYS"\n    confidence=max(35,min(95,50+abs(score-50)*1.2))\n    return {"name":name,"score":score,"confidence":confidence,"SMA20":sma20,"SMA50":sma50,"SMA200":sma200,"Return20D":ret20,"Return60D":ret60,"Volatility20D":vol}\n'''
          s2,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1:raise SystemExit("Market regime function not found")
          p.write_text(s2)

          p=Path("src/telegram_report.py")
          lines=p.read_text().splitlines()
          out=[];fixed=False
          for line in lines:
              if "sections.append(" in line and "Difference%" in line:
                  indent=line[:len(line)-len(line.lstrip())]
                  out.append(indent+'table=_table(["Type","Open","High","Low","Close"],[["Predicted",*[_fmt(v) for v in pred]],["Actual",*[_fmt(v) for v in actual]],["Difference%",*[_pct(_diff_pct(p,a)) for p,a in zip(pred,actual)]]])')
                  out.append(indent+'sections.append("\\n".join([f"💎 *₹ {_bucket_label(bucket,g)}*",f"*{str(r.get(\'Symbol\',\'-\')).strip()}*",*table]))')
                  fixed=True
              else: out.append(line)
          if not fixed:raise SystemExit("Evaluation table syntax line not found")
          p.write_text("\n".join(out)+"\n")
          PY
          python -m py_compile src/telegram_report.py src/morning_runner.py src/market_data.py src/portfolio_report.py
      - name: Run hardening, portfolio and market-outlook tests
        run: python -m pytest -q tests/test_stage10_5_hardening.py tests/test_portfolio_report_schema.py tests/test_market_outlook.py
      - name: Live market-data quality gate
        run: python -m src.live_quality_gate morning
      - name: Run Stage 10.5 morning prediction
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.morning_runner
      - name: Commit GitHub state
        run: |
          git config user.name "stocks-ai-predictor"
          git config user.email "actions@github.com"
          git add src/morning_runner.py src/market_data.py src/telegram_report.py src/portfolio_report.py data/stage2/
          if git diff --cached --quiet; then echo "No data/source changes."; exit 0; fi
          git commit -m "Fix portfolio decisions and market regime confidence"
          git pull --rebase origin main
          git push
