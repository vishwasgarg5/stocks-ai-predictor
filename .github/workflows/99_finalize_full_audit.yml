name: Finalize Full Repository Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply complete repository repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')

          # Production must contain exactly the three supported workflows before tests.
          wf=root/'.github/workflows'
          for name in ['00_full_repo_audit_repair.yml','repair_portfolio_now.yml','_fix_dynamic_sell.yml','99_finalize_full_audit.yml']:
              p=wf/name
              if p.exists(): p.unlink()

          # Configuration contract.
          p=root/'src/config.py'; s=p.read_text(); s=s.replace('HISTORY_PERIOD="5y"','HISTORY_PERIOD="3y"'); p.write_text(s)

          # Portfolio helpers and numerical hardening.
          p=root/'src/portfolio_report.py'; s=p.read_text()
          if 'def _attach_predictions(' not in s:
              marker='def _forecast_return(row):'
              helper='''def _attach_predictions(portfolio):\n    """Attach latest canonical morning predictions to holdings by NSE symbol."""\n    out=portfolio.copy(); predictions,prediction_date=_latest_predictions()\n    if out.empty or predictions is None or predictions.empty or "Symbol" not in predictions.columns:\n        return out,prediction_date\n    pred=predictions.copy()\n    pred["_key"]=pred["Symbol"].astype(str).str.upper().str.replace(r"\\.NS$","",regex=True)\n    key_col="Ticker" if "Ticker" in out.columns else "Stock" if "Stock" in out.columns else None\n    if key_col is None:return out,prediction_date\n    out["_key"]=out[key_col].astype(str).str.upper().str.replace(r"\\.NS$","",regex=True)\n    pred=pred.drop_duplicates("_key",keep="last").set_index("_key")\n    for col in pred.columns:\n        if col=="_key":continue\n        mapped=out["_key"].map(pred[col])\n        out[col]=out[col].where(out[col].notna(),mapped) if col in out.columns else mapped\n    return out.drop(columns=["_key"],errors="ignore"),prediction_date\n\n'''
              s=s.replace(marker,helper+marker,1)
          s=s.replace('def _forecast_return(row):return [(h,_num(row,f"Horizon_{h}D")) for h in HORIZONS if np.isfinite(_num(row,f"Horizon_{h}D"))]', 'def _forecast_return(row):\n    out=[]\n    for h in HORIZONS:\n        v=_num(row,f"Horizon_{h}D",np.nan)\n        if v is not None and np.isfinite(v): out.append((h,float(v)))\n    return out')
          s=s.replace('if c>=profit_target:return "SELL","10% profit target reached"','if c>=profit_target-1e-8:return "SELL","10% profit target reached"')
          if 'def _sell_plan(' not in s:
              s+='''\n\ndef _sell_plan(row,current_price,average_price,cutoff_date):\n    """Return dynamic sell profit %, target price, window, date and status."""\n    current=float(current_price); avg=float(average_price); minimum=float(TARGET_PROFIT_PCT)\n    confidence=_num(row,"AI_Confidence",0.0)\n    candidates=[(h,_num(row,f"Horizon_{h}D",np.nan)) for h in HORIZONS]\n    qualifying=[(h,float(v)) for h,v in candidates if v is not None and np.isfinite(v) and float(v)>=minimum]\n    if not qualifying:return minimum,avg*(1+minimum/100.0),"WAIT","-","WAIT"\n    best=max(qualifying,key=lambda x:(x[1],-x[0])); profit=float(best[1]) if confidence>=MIN_AI_CONFIDENCE else minimum\n    return profit,avg*(1+profit/100.0),f"{best[0]}D TARGET",_next_trading_date(cutoff_date,best[0]),"TARGET_DATE"\n'''
          p.write_text(s)

          # Selection is a trade selector: never promote negative-return or DOWN signals.
          p=root/'src/selection.py'; s=p.read_text()
          old='''    if strict.empty:strict=_apply_uncertainty_cap(base[base["Direction"].astype(str).str.upper().eq("UP")])\n    if strict.empty:strict=base[base["Direction"].astype(str).str.upper().eq("UP")].copy()\n    if strict.empty:strict=_apply_uncertainty_cap(scored.copy());fallback_mode=True\n    if strict.empty:strict=scored.copy();fallback_mode=True\n'''
          new='''    if strict.empty:return scored.iloc[0:0].copy()\n'''
          s=s.replace(old,new,1); s=s.replace('strict["SelectionTier"]="PREDICTION_ONLY" if fallback_mode else "RECOMMENDED"','strict["SelectionTier"]="RECOMMENDED"',1); p.write_text(s)

          # Final intelligence must work when optional columns are absent.
          p=root/'src/final_intelligence.py'; s=p.read_text()
          s=s.replace('out["NetExpectedReturn"]=pd.to_numeric(out.get("Expected_Return",0),errors="coerce").fillna(0).apply(net_expected_return);out["BenchmarkEdgePct"]=pd.to_numeric(out.get("Expected_Return",0),errors="coerce").fillna(0)-pd.to_numeric(out.get("BenchmarkExpectedReturn",0),errors="coerce").fillna(0)', 'expected=pd.to_numeric(out["Expected_Return"],errors="coerce").fillna(0) if "Expected_Return" in out.columns else pd.Series(0.0,index=out.index);benchmark=pd.to_numeric(out["BenchmarkExpectedReturn"],errors="coerce").fillna(0) if "BenchmarkExpectedReturn" in out.columns else pd.Series(0.0,index=out.index);out["NetExpectedReturn"]=expected.apply(net_expected_return);out["BenchmarkEdgePct"]=expected-benchmark',1)
          p.write_text(s)

          # Telegram output: show all requested long horizons and explicit confirmation/status.
          p=root/'src/telegram_report.py'; s=p.read_text()
          s=s.replace('return ["📈 *PREDICTED OHLC — TOP 10*",*_table(["Stock","Open","High","Low","Close"],rows)]','return [f"📈 *PREDICTED OHLC — TOP {len(rows)}*",*_table(["Stock","Open","High","Low","Close"],rows)]',1)
          s=s.replace('return ["🔮 *MULTI-HORIZON OUTLOOK — TOP 10*","3D / 7D / 10D / 20D / 60D / 180D / 365D trading-day expected return.",*_table(["Stock","3D","7D","10D","20D","60D","180D","365D","Status"],rows,max_width=11)]','return [f"🔮 *MULTI-HORIZON OUTLOOK — TOP {len(rows)}*","3D / 7D / 10D / 20D / 60D / 180D / 365D trading-day expected return.",*_table(["Stock","3D","7D","10D","20D","60D","180D","365D","Status"],rows,max_width=11)]',1)
          s=s.replace('def _portfolio_horizon_status(x):\n    vals=', 'def _portfolio_horizon_status(x):\n    explicit=str(x.get("Portfolio_Target_Status",x.get("Sell_Target_Status","")) or "").strip()\n    if explicit:return explicit.replace("_"," ")\n    vals=',1)
          s=s.replace('target=x.get("Profit_Target",x.get("Sell_Target_Profit_Pct",x.get("Portfolio_Target_Pct")));rows.append([x.get("Stock","-"),x.get("Quantity","-"),_decision(x.get("Decision")),x.get("Current_Price","-"),x.get("Average_Price","-"),x.get("AI_Target","-"),x.get("Return_Pct","-"),target if _num(target) is not None else "-",_portfolio_horizon_status(x),str(x.get("Sell_Window",x.get("Sell_Date","-")))])','profit_target=x.get("Profit_Target")\n        if profit_target is not None and _num(profit_target) is not None: target_text=str(profit_target)\n        else:\n            target_pct=x.get("Portfolio_Target_Pct",x.get("Sell_Target_Profit_Pct"))\n            target_text="-" if _num(target_pct) is None else f"{float(_num(target_pct)):.1f}%"\n        rows.append([x.get("Stock","-"),x.get("Quantity","-"),_decision(x.get("Decision")),x.get("Current_Price","-"),x.get("Average_Price","-"),x.get("AI_Target","-"),x.get("Return_Pct","-"),target_text,_portfolio_horizon_status(x),str(x.get("Sell_Window",x.get("Sell_Date","-")))])',1)
          s=s.replace('["Stock","Qty","Decision","CMP","Avg","AI Target","Return","10% Target","Horizon","Sell Window"]','["Stock","Qty","Decision","CMP","Avg","AI Target","Return","Target","Horizon","Sell Window"]',1)
          s=s.replace('if selected is None or selected.empty:return ["🔮 *MULTI-HORIZON OUTLOOK — TOP 10*","No multi-horizon predictions available."]','if selected is None or selected.empty:return ["🔮 *MULTI-HORIZON OUTLOOK — TOP 0*","No multi-horizon predictions available."]',1)
          p.write_text(s)

          # Full NSE wording.
          p=root/'src/stage28.py'; s=p.read_text().replace('nifty150_universe','full_nse_equity_universe').replace('Stage 28 | 1-365D | Nifty 150 |','Stage 28 | 1-365D | Full NSE |'); p.write_text(s)
          p=root/'README.md'; s=p.read_text().replace('- Nifty-150 screening is preserved.','- Full NSE equity screening is enabled; final morning predictions remain capped at 10.').replace('Nifty-150','full NSE'); p.write_text(s)

          # Remove orphan compatibility modules only when not referenced by source/tests.
          refs=' '.join(x.read_text(errors='ignore') for x in list((root/'src').glob('*.py'))+(list((root/'tests').glob('*.py')) if (root/'tests').exists() else []))
          for rel in ['src/workflow.py','src/telegram_report_patch.py','src/portfolio_decision_hardening.py','src/portfolio_long_horizon.py']:
              p=root/rel
              stem=p.stem
              if p.exists() and refs.count(stem)<=1:p.unlink()
          PY
      - name: Validate source and regression suite
        env: {PYTHONPATH: .}
        run: |
          python -m compileall -q src
          python -m pytest -q tests/
          python - <<'PY'
          import importlib
          from pathlib import Path
          modules=['config','features','market_data','models','prediction','multihorizon','selection','evaluation','retraining','ledger','morning_runner','evening','telegram_report','weekly_report','portfolio_report','quality_controls','live_quality_gate','intraday_engine','ipo_runner','stage28']
          for name in modules: importlib.import_module('src.'+name)
          from src.portfolio_report import _sell_plan,_next_trading_date
          assert _next_trading_date('2026-09-11',1)=='2026-09-15'
          assert _sell_plan({'AI_Confidence':80,'Horizon_20D':18.0,'Horizon_60D':16.0},450,500,'2026-09-07')[0]==18.0
          wf=Path('.github/workflows'); required=['01_morning_prediction.yml','02_evening_evaluation.yml','03_weekly_report.yml']
          assert sorted(p.name for p in wf.glob('*.yml'))==required
          print('FULL REPOSITORY CONTRACT: PASS')
          PY
      - name: Commit repaired production source
        run: |
          git config user.name 'stocks-ai-predictor'
          git config user.email 'actions@github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Repair interconnected Stage 28 production pipeline'
          git push
