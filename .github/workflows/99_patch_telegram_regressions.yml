name: Temporary regression repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch remaining regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Telegram contracts: dynamic portfolio targets, confirmed horizon status,
          # exact production headings, and explicit empty-selection messaging.
          p=Path('src/telegram_report.py'); s=p.read_text()
          old="raw=_decision(x.get('Decision'));ret=_num(x.get('Return_Pct'));c=_num(x.get('Current_Price'));a=_num(x.get('Average_Price'));t=_num(x.get('Profit_Target_Price')) or _num(x.get('AI_Target'));win=x.get('Sell_Window',x.get('Sell_Window_Days','-'));plan=x.get('New_Average_Price','-')"
          new="raw=_decision(x.get('Decision'));ret=_num(x.get('Return_Pct'));c=_num(x.get('Current_Price'));a=_num(x.get('Average_Price'));target_pct=_num(x.get('Portfolio_Target_Pct'));t=_num(x.get('Profit_Target_Price')) or _num(x.get('AI_Target'));target_display=f'{target_pct:.1f}%' if target_pct is not None else (f'₹{_fmt(t)}' if t is not None else 'N/A');win=x.get('Sell_Window',x.get('Sell_Window_Days','-'));plan=x.get('New_Average_Price','-')"
          if old in s:s=s.replace(old,new)
          s=s.replace("f'₹{_fmt(t)}' if t is not None else 'N/A',_pct(ret)","target_display,_pct(ret)")
          s=s.replace("No valid prediction candidates.","No high-confidence setup today.")
          s=s.replace("status='N/A' if len(valid)<3 else ('🟢 BULLISH' if sum(x>0 for x in valid)/len(valid)>=2/3 else '🟡 MIXED' if sum(x>0 for x in valid)/len(valid)>=1/3 else '🔴 WEAK')","status='N/A' if len(valid)<3 else ('CONFIRMED 🟢 BULLISH' if sum(x>0 for x in valid)/len(valid)>=2/3 else '🟡 MIXED' if sum(x>0 for x in valid)/len(valid)>=1/3 else '🔴 WEAK')")
          s=s.replace("PREDICTION SET BY PRICE BUCKET","QUALIFIED STOCKS BY PRICE BUCKET")
          s=s.replace("PREDICTED OHLC — TOP","PREDICTED OHLCV — TOP")
          p.write_text(s)

          # Portfolio engine: None-safe probability fallback in no-price test paths.
          p=Path('src/portfolio_report.py'); s=p.read_text()
          old="recovery_probability=float(np.clip(50+50*(max_forecast/required_recovery),0,95)) if np.isfinite(required_recovery) and required_recovery>0 and np.isfinite(max_forecast) else (95.0 if current>=avg else 0.0);profit_required="
          new="recovery_probability=float(np.clip(50+50*(max_forecast/required_recovery),0,95)) if np.isfinite(required_recovery) and required_recovery>0 and np.isfinite(max_forecast) else (95.0 if current is not None and np.isfinite(current) and current>=avg else 0.0);profit_required="
          if old not in s: raise SystemExit('portfolio recovery pattern missing')
          s=s.replace(old,new)
          old="profit_probability=float(np.clip(50+50*(max_forecast/profit_required),0,95)) if np.isfinite(profit_required) and profit_required>0 and np.isfinite(max_forecast) else (95.0 if current>=profit_target else 0.0);projected="
          new="profit_probability=float(np.clip(50+50*(max_forecast/profit_required),0,95)) if np.isfinite(profit_required) and profit_required>0 and np.isfinite(max_forecast) else (95.0 if current is not None and np.isfinite(current) and current>=profit_target else 0.0);projected="
          if old not in s: raise SystemExit('portfolio profit pattern missing')
          s=s.replace(old,new)
          p.write_text(s)

          # Final intelligence: the heuristic downside probability is a soft risk
          # signal; reserve NO TRADE for extreme downside rather than rejecting
          # otherwise strong high-confidence bullish candidates.
          p=Path('src/final_intelligence.py'); s=p.read_text()
          old="or n<min_net or down>=75:return \"NO TRADE\""
          new="or n<min_net or down>=90:return \"NO TRADE\""
          if old not in s: raise SystemExit('final action pattern missing')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Run full regression suite
        run: python -m pip install -r requirements.txt && python -m pytest -q tests/
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/99_patch_telegram_regressions.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/telegram_report.py src/portfolio_report.py src/final_intelligence.py .github/workflows/99_patch_telegram_regressions.yml
          git commit -m "Fix remaining Stage 10 regression contracts"
          git push origin HEAD:main
