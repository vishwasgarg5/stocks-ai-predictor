name: Stage 2 Test

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test_stage2.yml"

concurrency:
  group: stage2-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python source
        run: |
          python -m compileall -q src tests

      - name: Run Stage 2 tests
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          pytest -q tests/test_stage2.py -ra

      - name: Test result
        if: always()
        run: |
          echo "Stage 2 workflow test completed."
