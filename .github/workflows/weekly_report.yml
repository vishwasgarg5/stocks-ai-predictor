name: NIFTY 150 Weekly Model Report

on:
  schedule:
    # 15:30 UTC = 21:00 IST Friday, after the evening evaluation window.
    - cron: "30 15 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nifty150-weekly-report
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Generate weekly model report
        run: python weekly_report.py
      - name: Save weekly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/weekly_report.csv
          if git diff --cached --quiet; then echo "No weekly report changes."; exit 0; fi
          git commit -m "chore: save weekly model report"
          git push
