name: _fix_evening_stock_tables
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/_fix_evening_stock_tables.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch telegram report
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/telegram_report.py')
          s = p.read_text()
          if 'import math' not in s:
              s = s.replace('import html\n', 'import html\nimport math\n', 1)
          s = re.sub(r'def _num\(v, default=None\):\n(?:    .*\n){1,6}?\n\ndef _decision', '''def _num(v, default=None):\n    try:\n        x = float(v)\n        return x if math.isfinite(x) else default\n    except (TypeError, ValueError):\n        return default\n\n\ndef _decision''', s, count=1)
          start = s.index('def _evaluation_rows(')
          end = s.index('\ndef evening_report(', start)
          new_eval = r'''def _evaluation_bucket(row):
    bucket = row.get("PriceBucket")
    if bucket is not None and str(bucket).strip() not in {"", "nan", "None"}:
        return str(bucket)
    price = _num(row.get("Actual_Close", row.get("Pred_Close")))
    if price is None:
        return "UNKNOWN"
    if price < 50: return "B7"
    if price < 100: return "B6"
    if price < 250: return "B5"
    if price < 500: return "B4"
    if price < 1000: return "B3"
    if price < 2500: return "B2"
    return "B1"


def _evaluation_stock_tables(evaluation, market_date=None, limit=10):
    """Evening display: latest 10 evaluated stocks, max 6 per bucket, one table per stock."""
    if evaluation is None or evaluation.empty or "Symbol" not in evaluation.columns:
        return []
    e = evaluation.copy()
    if market_date is not None and "EvaluationDate" in e.columns:
        d = e["EvaluationDate"].astype(str).str[:10]
        target = str(market_date)[:10]
        latest = e[d == target]
        if not latest.empty:
            e = latest
    if "EvaluationDate" in e.columns:
        e = e.sort_values("EvaluationDate", kind="mergesort")
    e = e.drop_duplicates(subset=["Symbol"], keep="last").copy()
    e["_bucket"] = e.apply(_evaluation_bucket, axis=1)
    ordered = _ordered_price_buckets(e["_bucket"])
    ordered += [x for x in e["_bucket"].unique() if x not in ordered]
    sections = []
    displayed = 0
    for bucket in ordered:
        if displayed >= limit:
            break
        g = e[e["_bucket"] == bucket].copy()
        if g.empty:
            continue
        for _, r in _sort(g).head(min(6, limit - displayed)).iterrows():
            symbol = str(r.get("Symbol", "-")).strip()
            if not symbol or symbol.lower() in {"nan", "none"}:
                continue
            pred = [r.get("Pred_Open"), r.get("Pred_High"), r.get("Pred_Low"), r.get("Pred_Close")]
            actual = [r.get("Actual_Open"), r.get("Actual_High"), r.get("Actual_Low"), r.get("Actual_Close")]
            diff = [_diff_pct(p, a) for p, a in zip(pred, actual)]
            table = [f"💎 *₹ {_bucket_label(bucket, g)}*", f"*{symbol}*", *_table(["Type", "Open", "High", "Low", "Close"], [["Predicted", *[_fmt(v) for v in pred]], ["Actual", *[_fmt(v) for v in actual]], ["Difference%", *[_pct(v) for v in diff]]])]
            sections.append("\n".join(table))
            displayed += 1
            if displayed >= limit:
                break
    return sections
'''
          s = s[:start] + new_eval + s[end:]
          old = '''    rows = _evaluation_rows(evaluation, market_date=market_date, limit=10)\n    lines += _table(["Stock","Type","Open","High","Low","Close"], rows, max_width=12) if rows else ["No completed stock evaluations."]'''
          new = '''    stock_sections = _evaluation_stock_tables(evaluation, market_date=market_date, limit=10)\n    if stock_sections:\n        lines += [_SECTION.join(stock_sections)]\n    else:\n        lines += ["No completed stock evaluations."]'''
          if old not in s:
              raise SystemExit('expected evening table block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          compile(p.read_text(), str(p), 'exec')
          print('telegram_report.py compile OK')
          PY
      - name: Commit fix and remove repair workflow
        run: |
          git config user.name 'stocks-ai-predictor'
          git config user.email 'actions@github.com'
          git add src/telegram_report.py
          git commit -m 'Fix evening report stock-by-stock tables' || true
          git rm .github/workflows/_fix_evening_stock_tables.yml
          git commit -m 'Remove temporary evening report repair workflow'
          git push
