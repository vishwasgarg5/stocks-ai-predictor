name: Repair Telegram Report v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Fix Stage 10.5 Telegram report syntax'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix syntax and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/telegram_report.py')
          lines = p.read_text().splitlines()
          fixed = False
          for i, line in enumerate(lines):
              if 'rows.extend([[symbol,"Predicted"' in line and 'Difference%' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = indent + 'rows.extend([[symbol, "Predicted", *[_fmt(v) for v in pred]], [symbol, "Actual", *[_fmt(v) for v in actual]], [symbol, "Difference%", *[_pct(v) for v in diff]])'
                  fixed = True
                  break
          if not fixed:
              raise SystemExit('Target evening rows.extend line not found')
          p.write_text('\\n'.join(lines) + '\\n')
          PY
          python -m py_compile src/telegram_report.py
          git config user.name 'stocks-ai-predictor'
          git config user.email 'actions@github.com'
          git add src/telegram_report.py
          git commit -m 'Fix Stage 10.5 Telegram report syntax'
          git push origin HEAD:main
