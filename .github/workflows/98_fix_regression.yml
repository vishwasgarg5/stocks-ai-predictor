name: Emergency Regression Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor == 'stocks-ai-predictor' || github.event.head_commit.message == 'Add emergency regression repair'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Patch production regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          # Strict trade selection: never admit DOWN/negative-return fallbacks.
          p=root/'src/selection.py';s=p.read_text()
          old='''    if strict.empty:strict=_apply_uncertainty_cap(base[base["Direction"].astype(str).str.upper().eq("UP")])\n    if strict.empty:strict=base[base["Direction"].astype(str).str.upper().eq("UP")].copy()\n    if strict.empty:strict=_apply_uncertainty_cap(scored.copy());fallback_mode=True\n    if strict.empty:strict=scored.copy();fallback_mode=True\n    strict["SelectionTier"]="PREDICTION_ONLY" if fallback_mode else "RECOMMENDED"'''
          s=s.replace(old,'    if strict.empty:return scored.iloc[0:0].copy()\n    strict["SelectionTier"]="RECOMMENDED"',1);p.write_text(s)
          # Portfolio compatibility helpers + None-safe arithmetic.
          p=root/'src/portfolio_report.py';s=p.read_text()
          if 'def _attach_predictions(' not in s:
            helper='''def _attach_predictions(portfolio):\n    out=portfolio.copy(); predictions,prediction_date=_latest_predictions()\n    if out.empty or predictions is None or predictions.empty or "Symbol" not in predictions.columns:return out,prediction_date\n    pred=predictions.copy();pred["_key"]=pred["Symbol"].astype(str).str.upper().str.replace(r"\\.NS$","",regex=True)\n    key_col="Ticker" if "Ticker" in out.columns else "Stock" if "Stock" in out.columns else None\n    if key_col is None:return out,prediction_date\n    out["_key"]=out[key_col].astype(str).str.upper().str.replace(r"\\.NS$","",regex=True);pred=pred.drop_duplicates("_key",keep="last").set_index("_key")\n    for col in pred.columns:\n        if col=="_key":continue\n        mapped=out["_key"].map(pred[col]);out[col]=out[col].where(out[col].notna(),mapped) if col in out.columns else mapped\n    return out.drop(columns=["_key"],errors="ignore"),prediction_date\n\n'''
            s=s.replace('def _forecast_return(row):',helper+'def _forecast_return(row):',1)
          s=s.replace('def _forecast_return(row):return [(h,_num(row,f"Horizon_{h}D")) for h in HORIZONS if np.isfinite(_num(row,f"Horizon_{h}D"))]','''def _forecast_return(row):\n    out=[]\n    for h in HORIZONS:\n        v=_num(row,f"Horizon_{h}D",np.nan)\n        if v is not None and np.isfinite(v):out.append((h,float(v)))\n    return out''',1)
          s=s.replace('max_forecast=max((v for _,v in valid_forecasts),default=np.nan)','max_forecast=max((v for _,v in valid_forecasts),default=np.nan);max_forecast=float(max_forecast) if max_forecast is not None else np.nan',1)
          if 'def _sell_plan(' not in s:
            s+='''\n\ndef _sell_plan(row,current_price,average_price,cutoff_date):\n    avg=float(average_price);minimum=float(TARGET_PROFIT_PCT);confidence=_num(row,"AI_Confidence",0.0)\n    candidates=[(h,_num(row,f"Horizon_{h}D",np.nan)) for h in HORIZONS]\n    qualifying=[(h,float(v)) for h,v in candidates if v is not None and np.isfinite(v) and float(v)>=minimum]\n    if not qualifying:return minimum,avg*(1+minimum/100.0),"WAIT","-","WAIT"\n    best=max(qualifying,key=lambda x:(x[1],-x[0]));profit=float(best[1]) if confidence>=MIN_AI_CONFIDENCE else minimum\n    return profit,avg*(1+profit/100.0),f"{best[0]}D TARGET",_next_trading_date(cutoff_date,best[0]),"TARGET_DATE"\n'''
          p.write_text(s)
          # Optional-column safe final intelligence.
          p=root/'src/final_intelligence.py';s=p.read_text();old='out["NetExpectedReturn"]=pd.to_numeric(out.get("Expected_Return",0),errors="coerce").fillna(0).apply(net_expected_return);out["BenchmarkEdgePct"]=pd.to_numeric(out.get("Expected_Return",0),errors="coerce").fillna(0)-pd.to_numeric(out.get("BenchmarkExpectedReturn",0),errors="coerce").fillna(0)';new='expected=pd.to_numeric(out["Expected_Return"],errors="coerce").fillna(0) if "Expected_Return" in out.columns else pd.Series(0.0,index=out.index);benchmark=pd.to_numeric(out["BenchmarkExpectedReturn"],errors="coerce").fillna(0) if "BenchmarkExpectedReturn" in out.columns else pd.Series(0.0,index=out.index);out["NetExpectedReturn"]=expected.apply(net_expected_return);out["BenchmarkEdgePct"]=expected-benchmark';s=s.replace(old,new,1);p.write_text(s)
          # Telegram: dynamic row counts, explicit status, long-horizon visibility.
          p=root/'src/telegram_report.py';s=p.read_text()
          s=s.replace('return ["📈 *PREDICTED OHLC — TOP 10*",*_table(["Stock","Open","High","Low","Close"],rows)]','return [f"📈 *PREDICTED OHLCV — TOP {len(rows)}*",*_table(["Stock","Open","High","Low","Close"],rows)]',1)
          s=s.replace('return ["🔮 *MULTI-HORIZON OUTLOOK — TOP 10*","3D / 7D / 10D / 20D / 60D / 180D / 365D trading-day expected return.",*_table(["Stock","3D","7D","10D","20D","60D","180D","365D","Status"],rows,max_width=11)]','return [f"🔮 *MULTI-HORIZON OUTLOOK — TOP {len(rows)}*","3D / 7D / 10D / 20D / 60D / 180D / 365D trading-day expected return.",*_table(["Stock","3D","7D","10D","20D","60D","180D","365D","Status"],rows,max_width=11)]',1)
          s=s.replace('if selected is None or selected.empty:return ["🔮 *MULTI-HORIZON OUTLOOK — TOP 10*","No multi-horizon predictions available."]','if selected is None or selected.empty:return ["🔮 *MULTI-HORIZON OUTLOOK — TOP 0*","No multi-horizon predictions available."]',1)
          if 'explicit=str(x.get("Portfolio_Target_Status"' not in s:s=s.replace('def _portfolio_horizon_status(x):','def _portfolio_horizon_status(x):\n    explicit=str(x.get("Portfolio_Target_Status",x.get("Sell_Target_Status","")) or "").strip()\n    if explicit:return explicit.replace("_"," ")',1)
          p.write_text(s)
          # Integration candidate: preserve BUY for strong UP setup when score is just below adaptive threshold.
          p=root/'src/final_intelligence.py';s=p.read_text();s=s.replace('if s>=buy and d=="UP" and edge>=-BENCHMARK_TOLERANCE_PCT and hit>=50 and down<75:return "BUY"','if s>=min(buy,74.0) and d=="UP" and edge>=-BENCHMARK_TOLERANCE_PCT and hit>=50 and down<75:return "BUY"',1);p.write_text(s)
          PY
      - name: Validate
        env: {PYTHONPATH: .}
        run: |
          python -m compileall -q src
          python -m pytest -q tests/
      - name: Keep only production workflows
        run: |
          rm -f .github/workflows/98_fix_regression.yml .github/workflows/99_finalize_full_audit.yml .github/workflows/00_full_repo_audit_repair.yml .github/workflows/repair_portfolio_now.yml .github/workflows/_fix_dynamic_sell.yml
          git config user.name 'stocks-ai-predictor'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Fix Stage 28 regressions and finalize production workflows'
          git push
