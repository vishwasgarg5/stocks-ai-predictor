name: Repair Telegram Report Syntax
on:
  push:
    paths:
      - .github/workflows/_repair_telegram_report.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair syntax and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/telegram_report.py')
          s = p.read_text()
          old = 'rows.extend([[symbol,"Predicted",*[_fmt(v) for v in pred]],[symbol,"Actual",*[_fmt(v) for v in actual]],[symbol,"Difference%",*[_pct(v) for v in diff]])'
          new = 'rows.extend([[symbol, "Predicted", *[_fmt(v) for v in pred]], [symbol, "Actual", *[_fmt(v) for v in actual]], [symbol, "Difference%", *[_pct(v) for v in diff]])'
          if old not in s:
              raise SystemExit('Target syntax not found')
          p.write_text(s.replace(old, new))
          PY
          python -m py_compile src/telegram_report.py
          rm -f .github/workflows/_repair_telegram_report.yml
          git config user.name 'stocks-ai-predictor'
          git config user.email 'actions@github.com'
          git add src/telegram_report.py .github/workflows/_repair_telegram_report.yml
          git commit -m 'Fix Stage 10.5 Telegram report syntax'
          git push origin HEAD:main
