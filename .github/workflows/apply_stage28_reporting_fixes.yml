name: Apply Stage 28 reporting fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch reporting and recovery logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/telegram_report.py')
          s=p.read_text()
          s=s.replace('REPORT_HORIZONS=(3,7,10)', 'REPORT_HORIZONS=(3,7,10,20,60,180,365)')
          s=s.replace('"3D / 7D / 10D trading-day expected return."', '"3D / 7D / 10D / 20D / 60D / 180D / 365D trading-day expected return."')
          old='return ["🔮 *MULTI-HORIZON OUTLOOK — TOP 10*","3D / 7D / 10D trading-day expected return.",*_table(["Stock","3D","7D","10D","Status"],rows,max_width=13)]'
          new='return ["🔮 *MULTI-HORIZON OUTLOOK — TOP 10*","3D / 7D / 10D / 20D / 60D / 180D / 365D trading-day expected return.",*_table(["Stock","3D","7D","10D","20D","60D","180D","365D","Status"],rows,max_width=11)]'
          s=s.replace(old,new)
          old='if x is None or x.empty:return ["⚡ *INTRADAY TOP 5*","No intraday data/setup available."]'
          new='if x is None or x.empty:return ["⚡ *INTRADAY TOP 5*","No qualifying intraday setup. Live intraday feed may be unavailable, stale, or all candidates failed quality/score gates."]'
          s=s.replace(old,new)
          old='f"Accuracy: {_accuracy(accuracy.get(\'PreviousAccuracy\'))} → {_accuracy(accuracy.get(\'CurrentAccuracy\'))} | Samples {int(_num(accuracy.get(\'AccuracySamples\',accuracy.get(\'Samples\',0)),0) or 0)}"'
          new='(f"Accuracy: PENDING EVENING EVALUATION | Samples 0" if int(_num(accuracy.get("AccuracySamples",accuracy.get("Samples",0)),0) or 0)==0 else f"Accuracy: {_accuracy(accuracy.get(\'PreviousAccuracy\'))} → {_accuracy(accuracy.get(\'CurrentAccuracy\'))} | Samples {int(_num(accuracy.get(\'AccuracySamples\',accuracy.get(\'Samples\',0)),0) or 0)}")'
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('src/portfolio_report.py')
          s=p.read_text()
          s=s.replace('"Recovery_Gap_Pct","Sell_Reason","PredictionDate","PriceSource"]', '"Recovery_Gap_Pct","Recovery_Probability","Recovery_Horizon_Days","Profit_Target_Probability","Sell_Reason","PredictionDate","PriceSource"]')
          marker='    decision,reason=_decision(current,avg,target,confidence,forecasts)\n    projected='
          repl='    decision,reason=_decision(current,avg,target,confidence,forecasts)\n    required_recovery=((float(avg)/float(current)-1)*100) if current is not None and np.isfinite(current) and current>0 and pd.notna(avg) else np.nan\n    valid_forecasts=[(h,float(v)) for h,v in forecasts if np.isfinite(v)]\n    recovery_hits=[(h,v) for h,v in valid_forecasts if np.isfinite(required_recovery) and v>=required_recovery]\n    recovery_horizon=min((h for h,_ in recovery_hits),default=np.nan)\n    max_forecast=max((v for _,v in valid_forecasts),default=np.nan)\n    recovery_probability=float(np.clip(50+50*(max_forecast/required_recovery),0,95)) if np.isfinite(required_recovery) and required_recovery>0 and np.isfinite(max_forecast) else (95.0 if current>=avg else 0.0)\n    profit_required=((float(avg)*(1+TARGET_PROFIT_PCT/100))/float(current)-1)*100 if current is not None and np.isfinite(current) and current>0 and pd.notna(avg) else np.nan\n    profit_hits=[v for _,v in valid_forecasts if np.isfinite(profit_required) and v>=profit_required]\n    profit_probability=float(np.clip(50+50*(max_forecast/profit_required),0,95)) if np.isfinite(profit_required) and profit_required>0 and np.isfinite(max_forecast) else (95.0 if current>=profit_target else 0.0)\n    projected='
          s=s.replace(marker,repl)
          s=s.replace('"Recovery_Gap_Pct":recovery,"Sell_Reason":reason,', '"Recovery_Gap_Pct":recovery,"Recovery_Probability":recovery_probability,"Recovery_Horizon_Days":recovery_horizon,"Profit_Target_Probability":profit_probability,"Sell_Reason":reason,')
          s=s.replace('for c in OUTPUT_COLUMNS:\n        if c not in df.columns:df[c]=np.nan', 'for c in OUTPUT_COLUMNS:\n        if c not in df.columns:df[c]=np.nan')
          p.write_text(s)
          PY
      - name: Validate
        run: python -m compileall -q src
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/telegram_report.py src/portfolio_report.py
          git diff --cached --quiet || git commit -m "Fix Stage 28 reporting and portfolio recovery logic"
          git push
