name: Apply Stage 28 reporting fixes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch reporting and recovery logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/telegram_report.py')
          s=p.read_text()
          s=s.replace('REPORT_HORIZONS=(3,7,10)', 'REPORT_HORIZONS=(3,7,10,20,60,180,365)')
          s=s.replace('return ["🔮 *MULTI-HORIZON OUTLOOK — TOP 10*","3D / 7D / 10D trading-day expected return.",*_table(["Stock","3D","7D","10D","Status"],rows,max_width=13)]', 'return [f"🔮 *MULTI-HORIZON OUTLOOK — TOP {len(rows)}*","3D / 7D / 10D / 20D / 60D / 180D / 365D trading-day expected return.",*_table(["Stock","3D","7D","10D","20D","60D","180D","365D","Status"],rows,max_width=11)]')
          s=s.replace('return ["📈 *PREDICTED OHLC — TOP 10*",*_table(["Stock","Open","High","Low","Close"],rows)]', 'return [f"📈 *PREDICTED OHLC — TOP {len(rows)}*",*_table(["Stock","Open","High","Low","Close"],rows)]')
          s=s.replace('return ["📈 *PREDICTED OHLC — TOP 10*","No predictions available."]', 'return ["📈 *PREDICTED OHLC — TOP 0*","No valid predictions available."]')
          s=s.replace('return ["🔮 *MULTI-HORIZON OUTLOOK — TOP 10*","No multi-horizon predictions available."]', 'return ["🔮 *MULTI-HORIZON OUTLOOK — TOP 0*","No valid multi-horizon predictions available."]')
          s=s.replace('if x is None or x.empty:return ["⚡ *INTRADAY TOP 5*","No intraday data/setup available."]', 'if x is None or x.empty:return ["⚡ *INTRADAY TOP 5*","No qualifying intraday setup. Live intraday feed may be unavailable, stale, or all candidates failed quality/score gates."]')
          old='f"Accuracy: {_accuracy(accuracy.get(\'PreviousAccuracy\'))} → {_accuracy(accuracy.get(\'CurrentAccuracy\'))} | Samples {int(_num(accuracy.get(\'AccuracySamples\',accuracy.get(\'Samples\',0)),0) or 0)}"'
          new='(f"Accuracy: PENDING EVENING EVALUATION | Samples 0" if int(_num(accuracy.get("AccuracySamples",accuracy.get("Samples",0)),0) or 0)==0 else f"Accuracy: {_accuracy(accuracy.get(\'PreviousAccuracy\'))} → {_accuracy(accuracy.get(\'CurrentAccuracy\'))} | Samples {int(_num(accuracy.get(\'AccuracySamples\',accuracy.get(\'Samples\',0)),0) or 0)}")'
          s=s.replace(old,new)
          s=s.replace('vals=[_num(x.get(f"Horizon_{h}D")) for h in REPORT_HORIZONS];vals=[v for v in vals if v is not None]\n    if len(vals)>=3:\n        positive=sum(v>0 for v in vals);return "🟢 BULLISH" if positive==3 else "🟡 MIXED" if positive==2 else "🔴 WEAK"\n    ai=_num(x.get("AI_Target"));cp=_num(x.get("Current_Price"));', 'rp=_num(x.get("Recovery_Probability"));rh=_num(x.get("Recovery_Horizon_Days"));pp=_num(x.get("Profit_Target_Probability"));ai=_num(x.get("AI_Target"));cp=_num(x.get("Current_Price"));\n    if cp is not None and ai is not None and cp>=ai and cp>=_num(x.get("Average_Price"),cp): return "🟢 RECOVERED"\n    if rp is not None:\n        if rp>=70:return f"🟢 RECOVERY {int(rp)}%" + (f" / {int(rh)}D" if rh is not None else "")\n        if rp>=45:return f"🟡 RECOVERY {int(rp)}%" + (f" / {int(rh)}D" if rh is not None else "")\n        return f"🔴 RECOVERY {int(rp)}%"\n    ')
          p.write_text(s)

          p=Path('src/portfolio_report.py')
          s=p.read_text()
          s=s.replace('"Recovery_Gap_Pct","Sell_Reason","PredictionDate","PriceSource"]', '"Recovery_Gap_Pct","Recovery_Probability","Recovery_Horizon_Days","Profit_Target_Probability","Sell_Reason","PredictionDate","PriceSource"]')
          if '"Recovery_Probability"' not in s:
              raise SystemExit('portfolio output columns patch failed')
          marker='    decision,reason=_decision(current,avg,target,confidence,forecasts)\n    projected='
          repl='    decision,reason=_decision(current,avg,target,confidence,forecasts)\n    required_recovery=((float(avg)/float(current)-1)*100) if current is not None and np.isfinite(current) and current>0 and pd.notna(avg) else np.nan\n    valid_forecasts=[(h,float(v)) for h,v in forecasts if np.isfinite(v)]\n    recovery_hits=[(h,v) for h,v in valid_forecasts if np.isfinite(required_recovery) and v>=required_recovery]\n    recovery_horizon=min((h for h,_ in recovery_hits),default=np.nan)\n    max_forecast=max((v for _,v in valid_forecasts),default=np.nan)\n    recovery_probability=float(np.clip(50+50*(max_forecast/required_recovery),0,95)) if np.isfinite(required_recovery) and required_recovery>0 and np.isfinite(max_forecast) else (95.0 if current>=avg else 0.0)\n    profit_required=((float(avg)*(1+TARGET_PROFIT_PCT/100))/float(current)-1)*100 if current is not None and np.isfinite(current) and current>0 and pd.notna(avg) else np.nan\n    profit_probability=float(np.clip(50+50*(max_forecast/profit_required),0,95)) if np.isfinite(profit_required) and profit_required>0 and np.isfinite(max_forecast) else (95.0 if current>=profit_target else 0.0)\n    projected='
          if marker not in s:
              raise SystemExit('portfolio recovery marker missing')
          s=s.replace(marker,repl)
          s=s.replace('"Recovery_Gap_Pct":recovery,"Sell_Reason":reason,', '"Recovery_Gap_Pct":recovery,"Recovery_Probability":recovery_probability,"Recovery_Horizon_Days":recovery_horizon,"Profit_Target_Probability":profit_probability,"Sell_Reason":reason,')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          python -m compileall -q src
          python -m pytest -q tests/test_stage28_contract.py tests/test_prediction_lineage.py tests/test_report_integrity.py tests/test_portfolio_stage28_hardening.py tests/test_report_metrics_quality.py tests/test_portfolio_horizons.py
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/telegram_report.py src/portfolio_report.py
          git diff --cached --quiet || git commit -m "Harden Stage 28 reporting and portfolio recovery"
          git push
