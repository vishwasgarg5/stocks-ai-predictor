name: _fix_portfolio_dynamic_sell
on:
  push:
    paths:
      - '.github/workflows/_fix_portfolio_dynamic_sell.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch portfolio manager
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/portfolio_report.py')
          s = p.read_text()

          start = s.index('def _sell_window(')
          end = s.index('\ndef _average_plan(', start)
          new_fn = '''def _sell_plan(row, current, avg, prediction_date):
    """Use 10% as the minimum target; if AI forecasts more, target the higher return and date."""
    if current is None or pd.isna(current) or pd.isna(avg) or not prediction_date:
        return {"target_return": TARGET_PROFIT_PCT, "target_price": None, "window": "NO AI DATA", "date": "-"}
    forecasts = []
    for h in HORIZONS:
        value = row.get(f"Horizon_{h}D")
        try:
            value = float(value)
            if np.isfinite(value):
                forecasts.append((h, value))
        except (TypeError, ValueError):
            continue
    if not forecasts:
        target_return = TARGET_PROFIT_PCT
        target_horizon = None
    else:
        best_h, best_return = max(forecasts, key=lambda x: x[1])
        if best_return > TARGET_PROFIT_PCT:
            target_return = best_return
            target_horizon = best_h
        else:
            target_return = TARGET_PROFIT_PCT
            target_horizon = None
            for h, value in forecasts:
                if value >= TARGET_PROFIT_PCT:
                    target_horizon = h
                    break
    target_price = float(avg) * (1 + target_return / 100.0)
    if target_horizon is not None:
        date = _next_trading_date(prediction_date, int(target_horizon))
        if target_horizon <= 1:
            window = f"1D ({date})"
        else:
            start_date = _next_trading_date(prediction_date, max(1, int(target_horizon) - 2))
            window = f"{target_horizon}D ({start_date}→{date})"
        return {"target_return": target_return, "target_price": target_price, "window": window, "date": date}
    return {"target_return": target_return, "target_price": target_price, "window": f">{max(h for h, _ in forecasts)}D", "date": "-"}
'''
          s = s[:start] + new_fn + s[end:]

          old = 'target=float(target);row["Target_Return_Pct"]=(target/float(avg)-1)*100;conf=float(row.get("AI_Confidence",row.get("CalibratedConfidence",row.get("Confidence",0))) or 0);profit_target=float(row["Profit_Target_Price"]);row["Sell_Window"]=_sell_window(row,profit_target,price,row.get("PredictionDate"))'
          new = '''target=float(target);row["Target_Return_Pct"]=(target/float(avg)-1)*100;conf=float(row.get("AI_Confidence",row.get("CalibratedConfidence",row.get("Confidence",0))) or 0);sell_plan=_sell_plan(row,price,float(avg),row.get("PredictionDate"));row["Sell_Target_Profit_Pct"]=float(sell_plan["target_return"]);row["Sell_Target_Price"]=sell_plan["target_price"];row["Sell_Date"]=sell_plan["date"];row["Sell_Window"]=sell_plan["window"];profit_target=float(row["Sell_Target_Price"] or row["Profit_Target_Price"])'''
          if old not in s:
              raise SystemExit('target/sell-window line not found')
          s = s.replace(old, new, 1)

          # Replace the already-reached condition to use the dynamic target.
          old2 = 'if price>=profit_target:row["Recommended_Qty"]=0;row["New_Average_Price"]=float(avg);row["Projected_Return_At_AI_Target"]=(target/avg-1)*100;row["Averaging_Action"]="DO NOT AVG";row["Decision"]="SELL / PROFIT BOOK";row["Sell_Window"]="NOW";row["Sell_Reason"]=f"{TARGET_PROFIT_PCT:.0f}% portfolio profit target reached";return row'
          new2 = 'if price>=profit_target:row["Recommended_Qty"]=0;row["New_Average_Price"]=float(avg);row["Projected_Return_At_AI_Target"]=(target/avg-1)*100;row["Averaging_Action"]="DO NOT AVG";row["Decision"]="SELL / PROFIT BOOK";row["Sell_Window"]="NOW";row["Sell_Date"]=str(row.get("PredictionDate") or "TODAY");row["Sell_Reason"]=f"Minimum {TARGET_PROFIT_PCT:.0f}% target reached; dynamic AI target {row[\"Sell_Target_Profit_Pct\"]:.1f}%";return row'
          if old2 not in s:
              raise SystemExit('profit-book condition not found')
          s = s.replace(old2, new2, 1)

          # Keep all dynamic target fields initialized in the no-data branches.
          s = s.replace('row["Sell_Window"]="NO PRICE";row["Sell_Reason"]=', 'row["Sell_Target_Profit_Pct"]=TARGET_PROFIT_PCT;row["Sell_Target_Price"]=row["Profit_Target_Price"];row["Sell_Date"]="-";row["Sell_Window"]="NO PRICE";row["Sell_Reason"]=', 1)
          s = s.replace('row["Sell_Window"]="NO AI DATA";row["Sell_Reason"]=', 'row["Sell_Target_Profit_Pct"]=TARGET_PROFIT_PCT;row["Sell_Target_Price"]=row["Profit_Target_Price"];row["Sell_Date"]="-";row["Sell_Window"]="NO AI DATA";row["Sell_Reason"]=', 1)

          compile(s, str(p), 'exec')
          p.write_text(s)
          print('portfolio_report.py compile OK')

          # Add dynamic target/date fields to both morning/evening Telegram payloads.
          for fn in ['src/morning_runner.py', 'src/evening.py']:
              q = Path(fn)
              t = q.read_text()
              old = 'profit_target="-" if pd.isna(r.get("Profit_Target_Price")) else f"₹{float(r.Profit_Target_Price):,.2f}"'
              new = 'profit_target="-" if pd.isna(r.get("Sell_Target_Price",r.get("Profit_Target_Price"))) else f"₹{float(r.get(\"Sell_Target_Price\")):,.2f}";sell_target_pct="-" if pd.isna(r.get("Sell_Target_Profit_Pct")) else f"+{float(r.get(\"Sell_Target_Profit_Pct\")):.1f}%";sell_date=str(r.get("Sell_Date","-"))'
              if old in t:
                  t = t.replace(old, new, 1)
              else:
                  print(fn, 'payload target line already changed or not found')
              old_item = '"Profit_Target":profit_target,"Recommended_Qty":rec'
              new_item = '"Profit_Target":profit_target,"Sell_Target_Profit_Pct":sell_target_pct,"Sell_Date":sell_date,"Recommended_Qty":rec'
              if old_item in t:
                  t = t.replace(old_item, new_item, 1)
              else:
                  print(fn, 'payload item target not found')
              compile(t, fn, 'exec')
              q.write_text(t)
              print(fn, 'compile OK')

          # Update Telegram portfolio table to show dynamic target %, price and date.
          q = Path('src/telegram_report.py')
          t = q.read_text()
          old = 'lines = ["💼 *AI PORTFOLIO MANAGER*", "10% target is based on portfolio average; Window is based on the Top-10 AI multi-horizon forecast."]'
          new = 'lines = ["💼 *AI PORTFOLIO MANAGER*", "10% is the minimum target. If AI forecasts higher profit, the higher target and expected sell date are shown."]'
          if old in t: t = t.replace(old, new, 1)
          oldtbl = 'lines += _table(["Stock","Qty","Decision","CMP","Avg","10% Target","AI Window"], rows, max_width=18)'
          # Keep existing compact layout; add dynamic target/date through the existing item fields by replacing row construction.
          oldrow = 'rows.append([x.get("Stock","-"), x.get("Quantity","-"), _decision(x.get("Decision")), x.get("Current_Price","-"), x.get("Average_Price","-"), x.get("Profit_Target","-"), x.get("Sell_Window","-")])'
          newrow = 'rows.append([x.get("Stock","-"), x.get("Quantity","-"), _decision(x.get("Decision")), x.get("Current_Price","-"), x.get("Average_Price","-"), f"{x.get(\"Sell_Target_Profit_Pct\",\"-\")} / {x.get(\"Profit_Target\",\"-\")}", x.get("Sell_Date",x.get("Sell_Window","-"))])'
          if oldrow not in t: raise SystemExit('telegram portfolio row not found')
          t=t.replace(oldrow,newrow,1)
          t=t.replace('lines += _table(["Stock","Qty","Decision","CMP","Avg","10% Target","AI Window"], rows, max_width=18)', 'lines += _table(["Stock","Qty","Decision","CMP","Avg","Sell Target","Sell Date"], rows, max_width=18)', 1)
          compile(t, str(q), 'exec')
          q.write_text(t)
          print('telegram_report.py compile OK')
          PY
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name 'stocks-ai-predictor'
          git config user.email 'actions@github.com'
          git add src/portfolio_report.py src/morning_runner.py src/evening.py src/telegram_report.py
          git commit -m 'Make portfolio target dynamic with AI sell dates' || true
          git rm .github/workflows/_fix_portfolio_dynamic_sell.yml
          git commit -m 'Remove temporary portfolio repair workflow'
          git push
