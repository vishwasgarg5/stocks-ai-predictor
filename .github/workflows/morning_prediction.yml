name: NIFTY 150 Morning Prediction

on:
  workflow_dispatch:
  schedule:
    # 23:30 UTC = 05:00 IST. Scheduled run is guarded against GitHub delays.
    - cron: "30 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nifty150-daily-pipeline
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Guarded morning prediction (05:00 IST target)
        run: python src/morning_runner.py
      - name: Commit prediction ledger and Nifty 150 cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then echo "No morning prediction changes."; exit 0; fi
          git commit -m "chore: save morning NIFTY 150 prediction"
          git push
