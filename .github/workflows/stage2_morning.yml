name: Stage 4 Morning Prediction

on:
  schedule:
    - cron: "0 5 * * 1-5"
      timezone: "Asia/Kolkata"

  workflow_dispatch:

concurrency:
  group: stage4-morning
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prediction:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STAGE 4: price buckets + sector intelligence are integrated inside
      # src/morning_runner.py. The existing Stage 2 prediction engines remain.
      - name: Run Stage 4 morning engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m src.morning_runner

      - name: Commit Stage 4 data
        run: |
          git config user.name "stocks-ai-predictor"
          git config user.email "actions@github.com"
          git add data/stage2/
          if git diff --cached --quiet; then
            echo "No Stage 4 data changes."
            exit 0
          fi
          git commit -m "Stage 4 morning prediction"
          git pull --rebase origin main || true
          git push
