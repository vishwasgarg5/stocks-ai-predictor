name: Final Stage 10 Morning Prediction

on:
  schedule:
    - cron: "45 2 * * 1-5"   # 08:15 IST (GitHub Actions cron is UTC)
  workflow_dispatch:

concurrency:
  group: final-stage-morning
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prediction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run final Stage 10 morning engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.morning_runner
      - name: Commit final GitHub state
        run: |
          git config user.name "stocks-ai-predictor"
          git config user.email "actions@github.com"
          git add data/stage2/
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "Final Stage 10 morning prediction"
          git pull --rebase origin main || exit 1
          git push
