name: One-time Portfolio Repair

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Patch missing helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/portfolio_report.py')
          s=p.read_text()
          if 'def _sell_plan(' not in s:
              s += '''\n\n# Dynamic sell-plan helpers.\ndef _sell_plan(row, current_price, average_price, cutoff_date):\n    current=float(current_price); avg=float(average_price)\n    confidence=_num(row, 'AI_Confidence', 0.0)\n    minimum=float(TARGET_PROFIT_PCT)\n    horizons=(1,3,5,7,20,60,90,180,365)\n    candidates=[]\n    for h in horizons:\n        v=_num(row, f'Horizon_{h}D')\n        if np.isfinite(v): candidates.append((h, float(v)))\n    qualifying=[x for x in candidates if x[1] >= minimum]\n    if not qualifying:\n        return minimum, avg*(1+minimum/100), 'WAIT', '-', 'WAIT'\n    best=min(qualifying, key=lambda x: x[0])\n    profit=float(best[1])\n    if not np.isfinite(confidence) or confidence < MIN_AI_CONFIDENCE:\n        profit=minimum\n    price=avg*(1+profit/100)\n    window=f'{best[0]}D TARGET'\n    date=_next_trading_date(cutoff_date, best[0])\n    return profit, price, window, date, 'TARGET_DATE'\n'''
              p.write_text(s)
          PY
      - name: Validate
        run: |
          python -m compileall -q src
          python -m pytest -q tests/
      - name: Commit source repair
        run: |
          git config user.name 'stocks-ai-predictor'
          git config user.email 'actions@github.com'
          git add src/portfolio_report.py
          if git diff --cached --quiet; then echo 'No source changes needed'; else git commit -m 'Fix portfolio dynamic sell helpers'; git push; fi
