name: Stage 28 - Morning Prediction

on:
  schedule:
    - cron: "45 2 * * 1-5" # 08:15 IST
  workflow_dispatch:

concurrency:
  group: stage28-morning
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  TZ: Asia/Kolkata

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q src

      - name: Contract tests
        run: python -m pytest -q tests/test_stage28_contract.py tests/test_prediction_lineage.py tests/test_data_snapshot.py tests/test_report_integrity.py tests/test_portfolio_stage28_hardening.py

      - name: Market data quality gate
        run: python -m src.live_quality_gate morning

      - name: Run morning prediction
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.morning_runner

      - name: Commit generated state
        run: |
          git config user.name "stocks-ai-predictor"
          git config user.email "actions@github.com"
          git add data/stage2/
          if git diff --cached --quiet; then
            echo "No generated state changes."
            exit 0
          fi
          git commit -m "Update Stage 28 morning prediction state"
          git pull --rebase origin main
          git push
