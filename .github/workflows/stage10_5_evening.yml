name: Stage 28 Evening Evaluation & Learning

on:
  schedule:
    - cron: "10 10 * * 1-5" # 15:40 IST, Monday-Friday
  workflow_dispatch:

concurrency:
  group: stage28-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run complete test suite
        run: python -m pytest -q tests/
      - name: Run Stage 28 contract and canonical integrity tests
        run: python -m pytest -q tests/test_stage28_contract.py tests/test_data_snapshot.py tests/test_report_integrity.py tests/test_prediction_lineage.py tests/test_portfolio_stage28_hardening.py
      - name: Live market-data quality gate
        run: python -m src.live_quality_gate evening
      - name: Run Stage 28 evaluation and learning
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.evening
      - name: Verify immutable evaluation lineage and report shape
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from src.ledger import latest_prediction_date, load_predictions, evaluation_path
          from src.utils import today_ist
          market_date=today_ist()
          pred_date=latest_prediction_date(market_date)
          assert pred_date is not None, "No prediction ledger available"
          p=load_predictions(pred_date)
          e=pd.read_csv(evaluation_path(market_date))
          assert not p.empty and not e.empty, "Prediction/evaluation ledger empty"
          assert "Prediction_ID" in p.columns and "Prediction_ID" in e.columns, "Missing Prediction_ID"
          expected=dict(zip(p["Symbol"].astype(str),p["Prediction_ID"].astype(str)))
          for _,r in e.iterrows():
              assert expected.get(str(r["Symbol"]))==str(r["Prediction_ID"]), f"Lineage mismatch: {r['Symbol']}"
          for c in ["Pred_Open","Pred_High","Pred_Low","Pred_Close","Actual_Open","Actual_High","Actual_Low","Actual_Close"]:
              assert c in e.columns, f"Missing evaluation field {c}"
          print(f"Verified {len(e)} evaluation rows against {len(p)} immutable predictions")
          PY
      - name: Run live quality controls
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          MARKET_DATE=$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo("Asia/Kolkata")).date())
          PY
          )
          python -m src.quality_controls "$MARKET_DATE"
      - name: Commit GitHub state
        run: |
          git config user.name "stocks-ai-predictor"
          git config user.email "actions@github.com"
          git add data/stage2/
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "Run Stage 28 evening quality controls"
          git pull --rebase origin main
          git push
