name: NIFTY 50 Daily AI Prediction

on:
  workflow_dispatch:
  schedule:
    # 12:00 UTC = 17:30 IST, after the NSE session.
    - cron: "0 12 * * 1-5"

permissions:
  contents: write

# Prevent concurrent runs from racing on the GitHub-only data store.
concurrency:
  group: nifty50-daily-prediction
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily prediction flow
        run: python main.py

      - name: Commit updated GitHub data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports models
          if git diff --cached --quiet; then
            echo "No repository data/model changes to commit."
            exit 0
          fi
          git commit -m "chore: update NIFTY 50 data predictions and model"
          git push
