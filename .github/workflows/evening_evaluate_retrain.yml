name: NIFTY 50 Evening Evaluate and Retrain

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nifty50-daily-pipeline
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluate actuals and retrain
        run: python evening.py
      - name: Commit evaluation and model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports models
          if git diff --cached --quiet; then echo "No evening evaluation/model changes."; exit 0; fi
          git commit -m "chore: evaluate predictions and retrain model"
          git push
